<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMid slice">
  <!-- Taal Lake at dusk: the ridge, the lake, Volcano Island. A stand-in until a photo replaces it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#091315"/>
      <stop offset="0.38" stop-color="#16291f"/>
      <stop offset="0.62" stop-color="#4a6a45"/>
      <stop offset="0.8" stop-color="#c98a3c"/>
      <stop offset="0.86" stop-color="#f0b45a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.7" cy="0.6" r="0.35">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#f2a94a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2a94a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8f63"/>
      <stop offset="0.18" stop-color="#2c4529"/>
      <stop offset="1" stop-color="#0a1610"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf7d" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffcf7d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="720" fill="url(#sky)"/>
  <rect width="1600" height="720" fill="url(#sun)"/>
  <!-- far ridge (Tagaytay side) -->
  <path d="M0 470 C120 440 230 452 340 430 C470 404 560 432 680 418 C820 402 930 420 1060 410 C1200 398 1320 420 1440 408 C1520 400 1570 410 1600 404 L1600 520 L0 520Z" fill="#33502f" opacity="0.75"/>
  <!-- near ridge -->
  <path d="M0 500 C140 482 260 494 400 478 C520 464 640 486 780 480 C900 474 1040 488 1180 476 C1320 466 1460 482 1600 470 L1600 540 L0 540Z" fill="#1f3520"/>
  <!-- lake -->
  <rect y="508" width="1600" height="212" fill="url(#lake)"/>
  <!-- sun path on the water -->
  <path d="M1080 512 L1180 512 L1290 720 L980 720Z" fill="url(#glow)" opacity="0.45"/>
  <!-- Volcano Island: a low cone with a crater -->
  <path d="M760 520 C820 508 870 470 930 446 C960 434 985 440 1000 452 C1012 444 1030 440 1048 450 C1110 478 1170 506 1260 520 Z" fill="#101d13"/>
  <path d="M1000 452 C1012 460 1030 459 1048 450" fill="none" stroke="#4b6644" stroke-width="3" stroke-linecap="round"/>
  <!-- island reflection -->
  <path d="M760 522 C840 530 900 548 1000 556 C1100 548 1180 530 1260 522 Z" fill="#101d13" opacity="0.45"/>
  <!-- shimmer -->
  <g stroke="#ffd79a" stroke-linecap="round" opacity="0.5">
    <path d="M1100 560h60M1130 584h90M1080 610h70M1160 636h110M1110 668h80" stroke-width="2"/>
  </g>
  <g stroke="#a9c09e" stroke-linecap="round" opacity="0.18">
    <path d="M120 580h140M300 612h90M80 650h200M420 676h120M560 600h80M620 648h150" stroke-width="2"/>
  </g>
</svg>
